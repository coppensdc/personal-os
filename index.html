<!DOCTYPE html>
<html lang="en">
<head>

  <title>Personal OS</title>
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/css/base.css">

<body>
  <div id="os-nav"></div>
  <div class="page-body">

      <header class="header">
        <div class="header-row">
          <div>
            <div class="eyebrow">Personal OS</div>
            <h1 class="page-title">Home</h1>
          </div>
          <div class="today-label" id="today-label"></div>
        </div>
      </header>

      <div class="arcade-divider"></div>

        <span class="section-label">Modules</span>
      </div>

      <div class="module-list">
        <a class="list-row row" href="todos/index.html">

            <span class="list-row-title">Notepad</span>
            <span class="list-row-desc">Notes by topic</span>
          </span>
        </a>
      </div>
    </div>
  </div>

  <script>
    window.NAV_BASE = '.';
    window.NAV_ACTIVE = 'home';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/js/storage.js"></script>
  <script src="shared/js/nav.js"></script>
  <script src="shared/js/backup.js"></script>
  <script>
    document.getElementById('today-label').textContent = getTodayLabel();
  </script>
